<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Animated engineering roadmap pipeline">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#60a5fa;#8b5cf6;#22d3ee" dur="6s" repeatCount="indefinite"/></stop><stop offset=".5" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#f472b6;#34d399;#a78bfa" dur="7s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#34d399"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.m{font-family:ui-monospace,Consolas,monospace}.s{font-family:Inter,Segoe UI,Arial,sans-serif}</style>
</defs>
<rect width="1200" height="170" rx="22" fill="#071015"/>
<text x="54" y="42" class="m" font-size="13" fill="#64748b">04 / GROWTH PIPELINE</text>
<text x="54" y="79" class="s" font-size="29" font-weight="800" fill="#f8fafc">ENGINEERING PATH</text>
<path d="M430 116 H1135" stroke="#1f2937" stroke-width="8" stroke-linecap="round"/>
<path d="M430 116 H1135" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 22" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-280" dur="5s" repeatCount="indefinite"/></path>
<g class="m" font-size="11" text-anchor="middle">
 <g transform="translate(470 116)"><circle r="24" fill="#0f172a" stroke="#22d3ee"/><text y="4" fill="#cbd5e1">BASE</text></g>
 <g transform="translate(655 116)"><circle r="24" fill="#0f172a" stroke="#38bdf8"/><text y="4" fill="#cbd5e1">DATA</text></g>
 <g transform="translate(840 116)"><circle r="24" fill="#0f172a" stroke="#a78bfa"/><text y="4" fill="#cbd5e1">CLOUD</text></g>
 <g transform="translate(1025 116)"><circle r="24" fill="#0f172a" stroke="#34d399"/><text y="4" fill="#cbd5e1">PLAT</text></g>
</g>
<circle r="7" fill="#fff" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M430 116 H1135"/><animate attributeName="fill" values="#22d3ee;#8b5cf6;#34d399;#22d3ee" dur="5s" repeatCount="indefinite"/></circle>
</svg>