<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="AS animated monogram">
  <defs>
    <linearGradient id="g" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#ec4899;#f59e0b;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#f59e0b;#22d3ee;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#f59e0b;#22d3ee;#8b5cf6;#ec4899" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="18" y="18" width="964" height="224" rx="34" fill="#0b1020" fill-opacity="0.18" stroke="url(#g)" stroke-width="2"/>
  <text x="500" y="175" text-anchor="middle"
        font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="170" font-weight="900" letter-spacing="12"
        fill="url(#g)" filter="url(#glow)">AS</text>
  <text x="500" y="222" text-anchor="middle"
        font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="16" font-weight="700" letter-spacing="8"
        fill="url(#g)">BUILD • LEARN • IMPROVE • REPEAT</text>
</svg>