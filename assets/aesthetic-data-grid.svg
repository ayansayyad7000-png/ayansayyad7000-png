<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ayan Sayyad animated engineering systems banner">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020617"/>
    <stop offset=".48" stop-color="#07111f"/>
    <stop offset="1" stop-color="#090514"/>
  </linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset=".5" stop-color="#60a5fa"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="flow2" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#34d399"/>
    <stop offset=".55" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#8b5cf6"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#38bdf8" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="24"/>
  </filter>
  <clipPath id="frame"><rect x="1" y="1" width="1198" height="358" rx="26"/></clipPath>
</defs>

<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect width="1200" height="360" rx="28" fill="url(#grid)"/>

<!-- ambient light -->
<circle cx="735" cy="172" r="190" fill="url(#halo)" opacity=".65">
  <animate attributeName="cx" values="690;810;690" dur="10s" repeatCount="indefinite"/>
</circle>
<circle cx="1090" cy="25" r="150" fill="#8b5cf6" opacity=".045" filter="url(#soft)">
  <animate attributeName="cy" values="10;90;10" dur="12s" repeatCount="indefinite"/>
</circle>

<!-- left identity / terminal -->
<g transform="translate(54 45)">
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="0" y="18" font-size="10" fill="#64748b" letter-spacing="2.6">AYAN // ENGINEERING SYSTEMS</text>
    <text x="0" y="73" font-size="44" font-weight="800" fill="#f8fafc">Ayan Sayyad</text>
    <text x="2" y="105" font-size="15" fill="#cbd5e1">Data Engineering • Cloud • DevOps • AI Platform</text>
  </g>

  <g transform="translate(0 139)">
    <rect width="432" height="135" rx="16" fill="#050b16" stroke="#1e293b"/>
    <circle cx="20" cy="18" r="3" fill="#fb7185"/>
    <circle cx="32" cy="18" r="3" fill="#fbbf24"/>
    <circle cx="44" cy="18" r="3" fill="#34d399"/>
    <text x="62" y="22" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#64748b">pipeline.status</text>

    <g font-family="ui-monospace,Consolas,monospace" font-size="11">
      <text x="18" y="52" fill="#64748b">$</text>
      <text x="35" y="52" fill="#93c5fd">build</text>
      <text x="75" y="52" fill="#475569"> → </text>
      <text x="100" y="52" fill="#5eead4">learn</text>
      <text x="138" y="52" fill="#475569"> → </text>
      <text x="163" y="52" fill="#c4b5fd">improve</text>
      <text x="218" y="52" fill="#475569"> → </text>
      <text x="243" y="52" fill="#86efac">repeat</text>

      <text x="18" y="79" fill="#64748b">stream</text>
      <text x="74" y="79" fill="#e2e8f0">data → cloud → automation</text>

      <text x="18" y="106" fill="#64748b">state</text>
      <circle cx="74" cy="102" r="4" fill="#34d399" filter="url(#glow)">
        <animate attributeName="opacity" values=".3;1;.3" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="87" y="106" fill="#d1fae5">building</text>
      <rect x="145" y="97" width="8" height="12" rx="1" fill="#22d3ee">
        <animate attributeName="opacity" values="1;.1;1" dur=".9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</g>

<!-- central data flow -->
<g clip-path="url(#frame)">
  <path d="M540 238 C610 238 606 110 685 110 S776 250 850 250 S929 116 1010 116 S1084 222 1164 222"
        fill="none" stroke="#0f253a" stroke-width="16" stroke-linecap="round"/>
  <path d="M540 238 C610 238 606 110 685 110 S776 250 850 250 S929 116 1010 116 S1084 222 1164 222"
        fill="none" stroke="url(#flow)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-200" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- moving data packets -->
  <circle r="6" fill="#67e8f9" filter="url(#glow)">
    <animateMotion dur="5.2s" repeatCount="indefinite" path="M540 238 C610 238 606 110 685 110 S776 250 850 250 S929 116 1010 116 S1084 222 1164 222"/>
  </circle>
  <circle r="4.5" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="5.2s" begin="-1.7s" repeatCount="indefinite" path="M540 238 C610 238 606 110 685 110 S776 250 850 250 S929 116 1010 116 S1084 222 1164 222"/>
  </circle>
  <circle r="4.5" fill="#34d399" filter="url(#glow)">
    <animateMotion dur="5.2s" begin="-3.4s" repeatCount="indefinite" path="M540 238 C610 238 606 110 685 110 S776 250 850 250 S929 116 1010 116 S1084 222 1164 222"/>
  </circle>
</g>

<!-- pipeline nodes -->
<g font-family="ui-monospace,Consolas,monospace">
  <g transform="translate(685 110)">
    <circle r="35" fill="#07111f" stroke="#164e63"/>
    <circle r="27" fill="none" stroke="#22d3ee" stroke-opacity=".55" stroke-dasharray="5 7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <path d="M-12 -5h24M-12 2h24M-12 9h24" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="56" text-anchor="middle" font-size="10" fill="#94a3b8">INGEST</text>
  </g>

  <g transform="translate(850 250)">
    <circle r="35" fill="#07111f" stroke="#3730a3"/>
    <circle r="27" fill="none" stroke="#8b5cf6" stroke-opacity=".6" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <path d="M-12 -9h24v18h-24z M-6 -3h12v6h-12z" fill="none" stroke="#c4b5fd" stroke-width="1.8"/>
    <text x="0" y="56" text-anchor="middle" font-size="10" fill="#94a3b8">PROCESS</text>
  </g>

  <g transform="translate(1010 116)">
    <circle r="35" fill="#07111f" stroke="#065f46"/>
    <circle r="27" fill="none" stroke="#34d399" stroke-opacity=".6" stroke-dasharray="6 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
    </circle>
    <path d="M-14 7c-9 0-10-13-1-16 2-9 15-12 21-5 9-3 16 8 11 15 8 5 2 15-6 15h-25" fill="none" stroke="#86efac" stroke-width="1.8"/>
    <text x="0" y="56" text-anchor="middle" font-size="10" fill="#94a3b8">CLOUD</text>
  </g>
</g>

<!-- right live metrics -->
<g transform="translate(930 255)" font-family="ui-monospace,Consolas,monospace">
  <text x="0" y="0" font-size="9" fill="#64748b" letter-spacing="1.3">LIVE DELIVERY</text>
  <rect x="0" y="14" width="215" height="7" rx="3.5" fill="#111827"/>
  <rect x="0" y="14" width="68" height="7" rx="3.5" fill="url(#flow2)">
    <animate attributeName="width" values="42;205;126;205" dur="4.8s" repeatCount="indefinite"/>
  </rect>
  <text x="0" y="44" font-size="9" fill="#475569">CI/CD</text>
  <text x="45" y="44" font-size="9" fill="#475569">AWS</text>
  <text x="80" y="44" font-size="9" fill="#475569">DOCKER</text>
  <text x="132" y="44" font-size="9" fill="#475569">K8S</text>
  <text x="163" y="44" font-size="9" fill="#475569">DATA</text>
</g>

<!-- top right signal / minimal decoration -->
<g transform="translate(1122 48)">
  <circle r="22" fill="none" stroke="#334155"/>
  <circle r="14" fill="none" stroke="url(#flow)" stroke-width="2" stroke-dasharray="4 5">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#22d3ee" filter="url(#glow)"/>
</g>

<!-- footer telemetry -->
<g transform="translate(54 333)" font-family="ui-monospace,Consolas,monospace" font-size="9">
  <text x="0" y="0" fill="#475569">INPUT</text>
  <text x="52" y="0" fill="#334155">→</text>
  <text x="76" y="0" fill="#475569">TRANSFORM</text>
  <text x="151" y="0" fill="#334155">→</text>
  <text x="176" y="0" fill="#475569">ORCHESTRATE</text>
  <text x="268" y="0" fill="#334155">→</text>
  <text x="292" y="0" fill="#475569">DEPLOY</text>
  <text x="344" y="0" fill="#334155">→</text>
  <text x="368" y="0" fill="#475569">OBSERVE</text>
</g>

<rect x="1.5" y="1.5" width="1197" height="357" rx="26.5" fill="none" stroke="url(#flow)" stroke-width="3" opacity=".7">
  <animate attributeName="opacity" values=".48;.9;.48" dur="4s" repeatCount="indefinite"/>
</rect>
</svg>