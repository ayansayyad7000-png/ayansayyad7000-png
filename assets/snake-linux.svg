<svg xmlns="http://www.w3.org/2000/svg" width="620" height="118" viewBox="0 0 620 118">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1f2937" stroke-width="0.7" opacity=".5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="#0D1117"/>
  <rect x="1" y="1" width="618" height="116" rx="15" fill="url(#grid)" stroke="#30363D"/>
  <text x="22" y="28" fill="#F0F6FC" font-family="JetBrains Mono,monospace" font-size="14" font-weight="700">Ubuntu / Linux // Terminal Snake</text>
  <text x="22" y="48" fill="#8B949E" font-family="JetBrains Mono,monospace" font-size="9">Commands pulsing across a shell-style route</text>
  <path id="route" d="M42 83 H105 L130 64 L155 83 H225 L250 64 L275 83 H345 L370 64 L395 83 H465 L490 64 L515 83 H580" fill="none" stroke="#30363D" stroke-width="4" stroke-linecap="round"/>
<path d="M42 83 H105 L130 64 L155 83 H225 L250 64 L275 83 H345 L370 64 L395 83 H465 L490 64 L515 83 H580" fill="none" stroke="url(#g)" stroke-width="1.4" stroke-dasharray="8 10" opacity=".8"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.8s" repeatCount="indefinite"/></path>
