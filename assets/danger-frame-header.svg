<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70">
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop stop-color="#ff1744"/><stop offset=".5" stop-color="#ff6d00"/><stop offset="1" stop-color="#9c27ff"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
