<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="26" fill="#07111f"/>
  <text x="600" y="42" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="24" font-weight="700">DEVOPS ENGINEERING PATH</text>
  <text x="600" y="68" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="14">BUILD → TEST → PACKAGE → ORCHESTRATE → DEPLOY → OBSERVE</text>

  <path id="route" d="M100 170 H1100" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <path d="M100 170 H1100" fill="none" stroke="#1e293b" stroke-width="10" opacity=".35"/>

  <g font-family="monospace" text-anchor="middle">
    <g transform="translate(120 170)">
      <circle r="40" fill="#0f2238" stroke="#22d3ee" stroke-width="2"/>
      <text y="-4" fill="#67e8f9" font-size="15" font-weight="700">CODE</text>
      <text y="17" fill="#94a3b8" font-size="11">Python</text>
    </g>
    <g transform="translate(280 170)">
      <circle r="40" fill="#0f2238" stroke="#60a5fa" stroke-width="2"/>
      <text y="-4" fill="#93c5fd" font-size="15" font-weight="700">GIT</text>
      <text y="17" fill="#94a3b8" font-size="11">GitHub</text>
    </g>
    <g transform="translate(440 170)">
      <circle r="40" fill="#0f2238" stroke="#8b5cf6" stroke-width="2"/>
      <text y="-4" fill="#c4b5fd" font-size="15" font-weight="700">CI/CD</text>
      <text y="17" fill="#94a3b8" font-size="11">Actions</text>
    </g>
    <g transform="translate(600 170)">
      <circle r="40" fill="#0f2238" stroke="#38bdf8" stroke-width="2"/>
      <text y="-4" fill="#7dd3fc" font-size="15" font-weight="700">DOCKER</text>
      <text y="17" fill="#94a3b8" font-size="11">Images</text>
    </g>
    <g transform="translate(760 170)">
      <circle r="40" fill="#0f2238" stroke="#6366f1" stroke-width="2"/>
      <text y="-4" fill="#a5b4fc" font-size="15" font-weight="700">K8S</text>
      <text y="17" fill="#94a3b8" font-size="11">Deploy</text>
    </g>
    <g transform="translate(920 170)">
      <circle r="40" fill="#0f2238" stroke="#f59e0b" stroke-width="2"/>
      <text y="-4" fill="#fcd34d" font-size="15" font-weight="700">AWS</text>
      <text y="17" fill="#94a3b8" font-size="11">Cloud</text>
    </g>
    <g transform="translate(1080 170)">
      <circle r="40" fill="#0f2238" stroke="#22c55e" stroke-width="2"/>
      <text y="-4" fill="#86efac" font-size="15" font-weight="700">OBSERVE</text>
      <text y="17" fill="#94a3b8" font-size="11">Monitor</text>
    </g>
  </g>

  <circle r="9" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
  </circle>

  <g opacity=".9">
    <circle cx="120" cy="250" r="5" fill="#22d3ee"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="250" r="5" fill="#60a5fa"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" begin=".2s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="250" r="5" fill="#8b5cf6"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" begin=".4s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="250" r="5" fill="#38bdf8"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="250" r="5" fill="#6366f1"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="250" r="5" fill="#f59e0b"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="250" r="5" fill="#22c55e"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="296" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">Infrastructure as Code • Automation • Containers • Kubernetes • Cloud • Monitoring</text>
</svg>