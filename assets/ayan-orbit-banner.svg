<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ayan Sayyad animated engineering profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.48" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#090711"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A3FF12"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".34"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#6EE7F9" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="tiny"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .dash{stroke-dasharray:10 16;animation:dash 6s linear infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}.pulse2{animation:pulse 2.8s ease-in-out 1.1s infinite}.float{animation:float 5s ease-in-out infinite}.float2{animation:float 5.8s ease-in-out 1.4s infinite}.scan{animation:scan 5.5s linear infinite}.blink{animation:blink 1.9s steps(2,end) infinite}.fade{animation:fade 7s ease-in-out infinite}.fade2{animation:fade 7s ease-in-out 2.2s infinite}.fade3{animation:fade 7s ease-in-out 4.4s infinite}
      @keyframes dash{to{stroke-dashoffset:-104}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes scan{0%{transform:translateX(-220px)}100%{transform:translateX(1420px)}}@keyframes blink{50%{opacity:.15}}@keyframes fade{0%,28%,100%{opacity:.28}12%{opacity:1}}
      text{font-family:Segoe UI,Inter,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <ellipse cx="965" cy="165" rx="260" ry="210" fill="url(#glow)" filter="url(#soft)"/>
  <ellipse cx="140" cy="310" rx="210" ry="150" fill="#7C3AED" opacity=".12" filter="url(#soft)"/>

  <g opacity=".55">
    <path class="dash" d="M72 82 C220 22 310 116 454 62 S720 112 860 52 S1070 74 1142 40" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <path class="dash" d="M80 300 C230 250 300 330 455 276 S720 315 860 268 S1060 295 1138 246" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
  </g>

  <g transform="translate(948 176)">
    <circle r="122" fill="none" stroke="#22D3EE" stroke-opacity=".16" stroke-width="1"/>
    <circle r="91" fill="none" stroke="#A78BFA" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="6 11">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="58" fill="none" stroke="#A3FF12" stroke-opacity=".24" stroke-width="1.2" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#22D3EE" opacity=".85" filter="url(#tiny)" class="pulse"/>
    <circle r="5" fill="#E6FCFF"/>
    <g>
      <circle cx="0" cy="-91" r="6" fill="#A3FF12"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="0" cy="-122" r="5" fill="#A78BFA"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(72 82)">
    <text x="0" y="0" fill="#90F5FF" font-size="14" letter-spacing="4">ENGINEERING PROFILE / 2026</text>
    <text x="0" y="70" fill="#FFFFFF" font-size="55" font-weight="800" letter-spacing="1">AYAN SAYYAD</text>
    <rect x="0" y="91" width="560" height="3" rx="2" fill="url(#accent)" class="pulse"/>
    <text x="0" y="129" fill="#C7D2FE" font-size="19">DATA ENGINEERING  •  CLOUD  •  DEVOPS  •  AI PLATFORM</text>
    <text x="0" y="177" fill="#7DD3FC" font-size="15" class="fade">01  BUILD DATA SYSTEMS</text>
    <text x="0" y="203" fill="#C4B5FD" font-size="15" class="fade2">02  AUTOMATE CLOUD INFRASTRUCTURE</text>
    <text x="0" y="229" fill="#BEF264" font-size="15" class="fade3">03  SHIP RELIABLE AI PLATFORMS</text>
  </g>

  <g transform="translate(72 326)">
    <circle cx="6" cy="-6" r="4" fill="#A3FF12" class="blink"/>
    <text x="20" y="0" fill="#94A3B8" font-size="13" letter-spacing="2">BUILD. LEARN. IMPROVE. REPEAT.</text>
  </g>

  <rect class="scan" x="-220" y="0" width="120" height="360" fill="#22D3EE" opacity=".045" transform="skewX(-14)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="url(#accent)" stroke-opacity=".35"/>
</svg>