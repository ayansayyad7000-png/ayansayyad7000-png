<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset=".52" stop-color="#f5f7ff"/><stop offset="1" stop-color="#faf8ff"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0891b2"/><stop offset=".5" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0891b2" stop-opacity="0"/><stop offset=".5" stop-color="#0891b2" stop-opacity=".08"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cbd5e1" stroke-width="1" opacity=".32"/></pattern>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .m{font-family:'JetBrains Mono','Fira Code','Courier New',monospace}
    .pulse{animation:pulse 2.2s ease-in-out infinite}.pulse2{animation:pulse 2.2s ease-in-out .7s infinite}
    .dash{animation:dash 5s linear infinite}.dash2{animation:dash 7s linear reverse infinite}
    .blink{animation:blink 1s steps(1) infinite}.scan{animation:scan 8s linear infinite}.float{animation:float 4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes blink{0%,48%{opacity:1}50%,100%{opacity:0}}@keyframes scan{0%{transform:translateX(-360px)}100%{transform:translateX(1500px)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  </style>
</defs>
