<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050811"/><stop offset=".52" stop-color="#0a1020"/><stop offset="1" stop-color="#0d1424"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1" opacity=".35"/></pattern>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .m{font-family:'JetBrains Mono','Fira Code','Courier New',monospace}
    .pulse{animation:pulse 2.2s ease-in-out infinite}.pulse2{animation:pulse 2.2s ease-in-out .7s infinite}
    .dash{animation:dash 5s linear infinite}.dash2{animation:dash 7s linear reverse infinite}
    .blink{animation:blink 1s steps(1) infinite}.scan{animation:scan 8s linear infinite}.float{animation:float 4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-60}}@keyframes blink{0%,48%{opacity:1}50%,100%{opacity:0}}@keyframes scan{0%{transform:translateX(-360px)}100%{transform:translateX(1500px)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  </style>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#253249"/>
<rect x="-330" y="0" width="300" height="420" fill="url(#scan)" class="scan"/>

<!-- terminal chrome -->
<circle cx="52" cy="42" r="5.5" fill="#fb7185"/><circle cx="72" cy="42" r="5.5" fill="#fbbf24"/><circle cx="92" cy="42" r="5.5" fill="#34d399"/>
<text x="122" y="47" class="m" fill="#64748b" font-size="12">ayan@platform:~/engineering</text>
<circle cx="1060" cy="42" r="4" fill="#22d3ee" class="pulse" filter="url(#glow)"/><text x="1074" y="47" class="m" fill="#94a3b8" font-size="11">SYSTEM ONLINE</text>
<path d="M36 66H1164" stroke="#1f2a3d"/>

<!-- left identity terminal -->
<g transform="translate(48 96)">
  <text class="m" fill="#22d3ee" font-size="13">$ ./build-system --profile ayan --mode learning</text>
  <text y="48" class="m" fill="#f8fafc" font-size="42" font-weight="800" letter-spacing="1.5">AYAN SAYYAD</text>
  <text y="79" class="m" fill="url(#accent)" font-size="17" font-weight="700">DATA • CLOUD • DEVOPS • PLATFORM ENGINEERING</text>
  <rect x="544" y="62" width="8" height="20" rx="1" fill="#60a5fa" class="blink"/>
  <text y="112" class="m" fill="#94a3b8" font-size="13">Building practical systems where data, infrastructure and automation connect.</text>

  <g transform="translate(0 138)">
    <rect width="118" height="27" rx="13.5" fill="#071725" stroke="#164e63"/><circle cx="16" cy="13.5" r="3" fill="#22d3ee" class="pulse"/><text x="27" y="18" class="m" fill="#67e8f9" font-size="10">DATA PIPELINES</text>
    <rect x="128" width="112" height="27" rx="13.5" fill="#0a1427" stroke="#1e3a8a"/><circle cx="144" cy="13.5" r="3" fill="#60a5fa" class="pulse2"/><text x="155" y="18" class="m" fill="#93c5fd" font-size="10">CLOUD / AWS</text>
    <rect x="250" width="124" height="27" rx="13.5" fill="#111229" stroke="#3730a3"/><circle cx="266" cy="13.5" r="3" fill="#818cf8" class="pulse"/><text x="277" y="18" class="m" fill="#a5b4fc" font-size="10">DEVOPS / GITOPS</text>
    <rect x="384" width="132" height="27" rx="13.5" fill="#171126" stroke="#6b21a8"/><circle cx="400" cy="13.5" r="3" fill="#a78bfa" class="pulse2"/><text x="411" y="18" class="m" fill="#c4b5fd" font-size="10">AI PLATFORM</text>
  </g>

  <g transform="translate(0 193)">
    <text class="m" fill="#64748b" font-size="10">LIVE BUILD LOG</text>
    <text y="24" class="m" fill="#86efac" font-size="11">[OK]</text><text x="38" y="24" class="m" fill="#cbd5e1" font-size="11">ingest      kafka  →  spark</text>
    <text y="45" class="m" fill="#86efac" font-size="11">[OK]</text><text x="38" y="45" class="m" fill="#cbd5e1" font-size="11">orchestrate airflow → jobs</text>
    <text y="66" class="m" fill="#fbbf24" font-size="11">[~ ]</text><text x="38" y="66" class="m" fill="#cbd5e1" font-size="11">deploy      docker  →  eks</text>
    <text y="87" class="m" fill="#60a5fa" font-size="11">[→ ]</text><text x="38" y="87" class="m" fill="#cbd5e1" font-size="11">observe     logs + metrics</text>
  </g>
</g>

<!-- right architecture panel -->
<g transform="translate(690 91)">
  <rect width="462" height="278" rx="18" fill="#07101f" fill-opacity=".78" stroke="#26354c"/>
  <text x="18" y="25" class="m" fill="#64748b" font-size="10">LIVE PLATFORM TOPOLOGY</text>
  <text x="356" y="25" class="m" fill="#22d3ee" font-size="10">PACKETS</text><text x="411" y="25" class="m" fill="#86efac" font-size="10">ACTIVE</text>

  <!-- data plane connections -->
  <path id="p1" d="M44 84H132" fill="none" stroke="#155e75" stroke-width="2" stroke-dasharray="5 7" class="dash"/>
  <path id="p2" d="M185 84H266" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 7" class="dash2"/>
  <path id="p3" d="M319 84H397" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="5 7" class="dash"/>
  <path id="p4" d="M319 111V171H397" fill="none" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 7" class="dash2"/>
  <path id="p5" d="M266 111V171H185" fill="none" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 7" class="dash"/>
  <path id="p6" d="M132 111V171H44" fill="none" stroke="#334155" stroke-width="1.7" stroke-dasharray="5 7" class="dash2"/>

  <!-- packets -->
  <circle r="4" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="4" fill="#60a5fa" filter="url(#glow)"><animateMotion dur="2.2s" begin=".6s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle r="4" fill="#a78bfa" filter="url(#glow)"><animateMotion dur="2.4s" begin="1.1s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <circle r="3.5" fill="#38bdf8"><animateMotion dur="3.4s" begin=".3s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
  <circle r="3.5" fill="#c084fc"><animateMotion dur="3.1s" begin="1.4s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>

  <!-- nodes -->
  <g class="float"><rect x="15" y="60" width="58" height="50" rx="10" fill="#08202a" stroke="#155e75"/><text x="44" y="80" text-anchor="middle" class="m" fill="#67e8f9" font-size="9">API</text><text x="44" y="96" text-anchor="middle" class="m" fill="#94a3b8" font-size="8">SOURCE</text></g>
  <g><rect x="132" y="60" width="53" height="50" rx="10" fill="#0a1c30" stroke="#1d4ed8"/><text x="158.5" y="80" text-anchor="middle" class="m" fill="#93c5fd" font-size="9">KAFKA</text><text x="158.5" y="96" text-anchor="middle" class="m" fill="#94a3b8" font-size="8">STREAM</text></g>
  <g class="float"><rect x="266" y="60" width="53" height="50" rx="10" fill="#11172e" stroke="#4338ca"/><text x="292.5" y="80" text-anchor="middle" class="m" fill="#a5b4fc" font-size="9">SPARK</text><text x="292.5" y="96" text-anchor="middle" class="m" fill="#94a3b8" font-size="8">PROCESS</text></g>
  <g><rect x="397" y="60" width="50" height="50" rx="10" fill="#17132d" stroke="#7e22ce"/><text x="422" y="80" text-anchor="middle" class="m" fill="#d8b4fe" font-size="9">S3</text><text x="422" y="96" text-anchor="middle" class="m" fill="#94a3b8" font-size="8">LAKE</text></g>

  <g><rect x="15" y="171" width="76" height="52" rx="10" fill="#0b1625" stroke="#334155"/><text x="53" y="191" text-anchor="middle" class="m" fill="#cbd5e1" font-size="9">GITHUB</text><text x="53" y="207" text-anchor="middle" class="m" fill="#64748b" font-size="8">SOURCE</text></g>
  <g><rect x="146" y="171" width="76" height="52" rx="10" fill="#0b1625" stroke="#334155"/><text x="184" y="191" text-anchor="middle" class="m" fill="#cbd5e1" font-size="9">AIRFLOW</text><text x="184" y="207" text-anchor="middle" class="m" fill="#64748b" font-size="8">CONTROL</text></g>
  <g><rect x="276" y="171" width="76" height="52" rx="10" fill="#0b1625" stroke="#334155"/><text x="314" y="191" text-anchor="middle" class="m" fill="#cbd5e1" font-size="9">EKS</text><text x="314" y="207" text-anchor="middle" class="m" fill="#64748b" font-size="8">RUNTIME</text></g>
  <g><rect x="386" y="171" width="61" height="52" rx="10" fill="#0b1625" stroke="#334155"/><text x="416.5" y="191" text-anchor="middle" class="m" fill="#cbd5e1" font-size="9">OBS</text><text x="416.5" y="207" text-anchor="middle" class="m" fill="#64748b" font-size="8">METRICS</text></g>

  <path d="M53 223V248H416V223" fill="none" stroke="#334155" stroke-dasharray="3 5"/>
  <text x="234" y="262" text-anchor="middle" class="m" fill="#64748b" font-size="9">CONTROL PLANE  •  DEPLOY  •  ORCHESTRATE  •  OBSERVE</text>
