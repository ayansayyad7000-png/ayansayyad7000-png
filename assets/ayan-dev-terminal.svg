<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#141026"/>
      <stop offset="100%" stop-color="#07151a"/>
    </linearGradient>
    <linearGradient id="scanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#58a6ff" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#a371f7" stop-opacity="0.48"/>
      <stop offset="75%" stop-color="#00d9ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#00d9ff"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:'Courier New',monospace}
      .dim{fill:#8b949e}
      .white{fill:#f0f6fc}
      .blue{fill:#58a6ff}
      .purple{fill:#a371f7}
      .cyan{fill:#00d9ff}
      .green{fill:#39d353}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}
      @keyframes float1{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
      @keyframes scan{0%{transform:translateX(-620px)}100%{transform:translateX(1220px)}}
      @keyframes dash{to{stroke-dashoffset:-26}}
      .pulse{animation:pulse 1.6s ease-in-out infinite}
      .cursor{animation:blink .9s steps(1) infinite}
      .dot1{animation:float1 3s ease-in-out infinite}
      .dot2{animation:float2 4s ease-in-out infinite}
      .scan{animation:scan 5s linear infinite}
      .dash{animation:dash 2.2s linear infinite}
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="298" rx="24" fill="url(#bg)" stroke="#30363d"/>
  <rect x="24" y="24" width="952" height="252" rx="16" fill="#0b0f14" stroke="#21262d"/>

  <circle cx="52" cy="50" r="6" fill="#ff5f56"/>
  <circle cx="72" cy="50" r="6" fill="#ffbd2e"/>
  <circle cx="92" cy="50" r="6" fill="#27c93f"/>
  <text x="120" y="56" class="mono dim" font-size="15">ayan@github: ~/ai-platform</text>

  <circle cx="844" cy="51" r="5" class="pulse" fill="#00d9ff" filter="url(#softGlow)"/>
  <text x="858" y="56" class="mono cyan" font-size="13">SYSTEM ONLINE</text>

  <text x="56" y="104" class="mono blue" font-size="18">$ whoami</text>
  <text x="56" y="142" class="mono white" font-size="34" font-weight="700">AYAN SAYYAD</text>

  <g>
    <text x="56" y="178" class="mono" font-size="20" font-weight="700" fill="url(#roleGradient)">AI PLATFORM ENGINEER</text>
    <rect x="278" y="159" width="11" height="24" fill="#a371f7" class="cursor"/>
  </g>

  <text x="56" y="207" class="mono" font-size="15">
    <tspan fill="#ff9900">AWS</tspan><tspan fill="#8b949e"> // </tspan>
    <tspan fill="#f0f6fc">LINUX</tspan><tspan fill="#8b949e"> // </tspan>
    <tspan fill="#58a6ff">DEVOPS</tspan><tspan fill="#8b949e"> // </tspan>
    <tspan fill="#a371f7">MLOPS</tspan><tspan fill="#8b949e"> // </tspan>
    <tspan fill="#3776ab">PYTHON</tspan><tspan fill="#8b949e"> // </tspan>
    <tspan fill="#00d9ff">SQL</tspan>
  </text>
  <text x="56" y="237" class="mono dim" font-size="15">Building cloud, automation and AI platform foundations.</text>
  <text x="56" y="263" class="mono purple" font-size="14">$ stack --focus=aws,linux,devops,mlops,python,sql</text>

  <g opacity="0.95">
    <circle cx="816" cy="131" r="34" fill="none" stroke="#a371f7" stroke-width="1.5" class="dot1"/>
    <circle cx="886" cy="170" r="18" fill="none" stroke="#58a6ff" stroke-width="1.3" class="dot2"/>
    <circle cx="917" cy="119" r="6" fill="#00d9ff" class="pulse" filter="url(#softGlow)"/>
    <path d="M786 210 C835 168 895 220 946 176" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6 7" class="dash"/>
    <circle cx="943" cy="176" r="4" fill="#39d353" class="pulse"/>
  </g>

  <rect x="-520" y="24" width="500" height="252" fill="url(#scanGlow)" opacity="0.20" class="scan"/>
</svg>