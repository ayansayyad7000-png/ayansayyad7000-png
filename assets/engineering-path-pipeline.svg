<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Animated engineering path from coding fundamentals to AI platform engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0A1023"/>
      <stop offset="1" stop-color="#090515"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.35" stop-color="#60A5FA"/>
      <stop offset="0.68" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#A3FF12"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#D9F99D"/>
      <stop offset="0.35" stop-color="#A3FF12"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <style>
      text{font-family:Segoe UI,Inter,Arial,sans-serif}
      .pathGlow{stroke-dasharray:12 14;animation:dash 4.5s linear infinite}
      .node{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
      .n2{animation-delay:.45s}.n3{animation-delay:.9s}.n4{animation-delay:1.35s}.n5{animation-delay:1.8s}.n6{animation-delay:2.25s}
      .scan{animation:scan 5s linear infinite}
      .spark{animation:blink 1.8s ease-in-out infinite}
      .s2{animation-delay:.5s}.s3{animation-delay:1s}.s4{animation-delay:1.5s}
      @keyframes dash{to{stroke-dashoffset:-156}}
      @keyframes pulse{0%,100%{opacity:.78;transform:scale(.98)}50%{opacity:1;transform:scale(1.025)}}
      @keyframes scan{0%{transform:translateX(-260px);opacity:0}10%{opacity:.7}90%{opacity:.7}100%{transform:translateX(1420px);opacity:0}}
      @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
    </style>
    <path id="route" d="M115 120 C270 40 340 180 470 120 S720 60 820 150 S980 245 1085 190 C1000 270 945 330 825 328 S595 270 500 360 S250 505 120 420"/>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="130" fill="#7C3AED" opacity=".08" filter="url(#soft)"/>
  <circle cx="180" cy="470" r="150" fill="#22D3EE" opacity=".07" filter="url(#soft)"/>

  <g opacity=".18" stroke="#334155" stroke-width="1">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200"/>
    <path d="M150 0V560M300 0V560M450 0V560M600 0V560M750 0V560M900 0V560M1050 0V560"/>
  </g>

  <text x="60" y="54" fill="#E2E8F0" font-size="25" font-weight="800" letter-spacing="1">ENGINEERING PATH // LIVE PIPELINE</text>
  <text x="60" y="82" fill="#64748B" font-size="13" letter-spacing="3">FOUNDATION → CLOUD → AUTOMATION → DATA → PLATFORM</text>

  <use href="#route" fill="none" stroke="#1E293B" stroke-width="12" opacity=".9"/>
  <use href="#route" fill="none" stroke="url(#flow)" stroke-width="3.2" class="pathGlow" filter="url(#glow)"/>

  <g filter="url(#glow)">
    <circle r="7" fill="#E0F2FE">
      <animateMotion dur="5.6s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="4" fill="#A3FF12" opacity=".9">
      <animateMotion dur="5.6s" begin="-1.85s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="4" fill="#A78BFA" opacity=".9">
      <animateMotion dur="5.6s" begin="-3.7s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
    </circle>
  </g>

  <g class="node" transform="translate(55 93)">
    <rect width="220" height="92" rx="18" fill="#0F172A" stroke="#22D3EE" stroke-opacity=".75"/>
    <circle cx="24" cy="26" r="7" fill="#22D3EE" class="spark" filter="url(#glow)"/>
    <text x="43" y="31" fill="#F8FAFC" font-size="17" font-weight="800">01 FOUNDATION</text>
    <text x="20" y="59" fill="#CBD5E1" font-size="13">Python • SQL • Git • Linux</text>
    <text x="20" y="79" fill="#67E8F9" font-size="11" letter-spacing="1.5">BUILD THE BASE</text>
  </g>

  <g class="node n2" transform="translate(345 82)">
    <rect width="210" height="92" rx="18" fill="#0F172A" stroke="#60A5FA" stroke-opacity=".75"/>
    <circle cx="24" cy="26" r="7" fill="#60A5FA" class="spark s2" filter="url(#glow)"/>
    <text x="43" y="31" fill="#F8FAFC" font-size="17" font-weight="800">02 CLOUD</text>
    <text x="20" y="59" fill="#CBD5E1" font-size="13">AWS • EC2 • S3 • IAM</text>
    <text x="20" y="79" fill="#93C5FD" font-size="11" letter-spacing="1.5">SHIP TO INFRA</text>
  </g>

  <g class="node n3" transform="translate(655 102)">
    <rect width="245" height="92" rx="18" fill="#0F172A" stroke="#818CF8" stroke-opacity=".75"/>
    <circle cx="24" cy="26" r="7" fill="#818CF8" class="spark s3" filter="url(#glow)"/>
    <text x="43" y="31" fill="#F8FAFC" font-size="17" font-weight="800">03 AUTOMATION</text>
    <text x="20" y="59" fill="#CBD5E1" font-size="13">Docker • CI/CD • Terraform</text>
    <text x="20" y="79" fill="#A5B4FC" font-size="11" letter-spacing="1.5">REPEATABLE SYSTEMS</text>
  </g>

  <g class="node n4" transform="translate(915 205)">
    <rect width="225" height="92" rx="18" fill="#0F172A" stroke="#A78BFA" stroke-opacity=".8"/>
    <circle cx="24" cy="26" r="7" fill="#A78BFA" class="spark s4" filter="url(#glow)"/>
    <text x="43" y="31" fill="#F8FAFC" font-size="17" font-weight="800">04 DATA FLOW</text>
    <text x="20" y="59" fill="#CBD5E1" font-size="13">Kafka • Airflow • Spark</text>
    <text x="20" y="79" fill="#C4B5FD" font-size="11" letter-spacing="1.5">MOVE + PROCESS DATA</text>
  </g>

  <g class="node n5" transform="translate(655 330)">
    <rect width="255" height="92" rx="18" fill="#0F172A" stroke="#C084FC" stroke-opacity=".8"/>
    <circle cx="24" cy="26" r="7" fill="#C084FC" class="spark" filter="url(#glow)"/>
    <text x="43" y="31" fill="#F8FAFC" font-size="17" font-weight="800">05 ORCHESTRATION</text>
    <text x="20" y="59" fill="#CBD5E1" font-size="13">Kubernetes • Observability</text>
    <text x="20" y="79" fill="#D8B4FE" font-size="11" letter-spacing="1.5">OPERATE AT SCALE</text>
  </g>

  <g class="node n6" transform="translate(250 392)">
    <rect width="300" height="108" rx="22" fill="#101827" stroke="#A3FF12" stroke-opacity=".9"/>
    <circle cx="31" cy="31" r="18" fill="url(#core)" filter="url(#glow)"/>
    <circle cx="31" cy="31" r="7" fill="#D9F99D"/>
    <text x="62" y="35" fill="#F8FAFC" font-size="19" font-weight="900">06 PLATFORM ENGINEERING</text>
    <text x="22" y="67" fill="#CBD5E1" font-size="13">Data Platform → AI Platform</text>
    <text x="22" y="91" fill="#BEF264" font-size="11" letter-spacing="2">TARGET: PRODUCTION SYSTEMS</text>
  </g>

  <rect class="scan" x="-220" y="0" width="180" height="560" fill="url(#flow)" opacity=".07" transform="skewX(-18)"/>

  <text x="1160" y="530" text-anchor="end" fill="#475569" font-size="11" letter-spacing="2.2">BUILD • AUTOMATE • SCALE • EVOLVE</text>
</svg>