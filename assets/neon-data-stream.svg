<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Animated neon engineering data stream">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.52" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#080B14"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.33" stop-color="#22D3EE"/>
      <stop offset="0.68" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A3FF12"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <path id="route" d="M55 154 C155 72 250 230 355 145 S555 72 650 145 S850 224 955 145 S1085 78 1145 132"/>
    <style>
      text{font-family:Segoe UI,Inter,Arial,sans-serif}
      .grid{opacity:.11}
      .dash{stroke-dasharray:9 15;animation:dash 5.5s linear infinite}
      .node{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .n2{animation-delay:.35s}.n3{animation-delay:.7s}.n4{animation-delay:1.05s}.n5{animation-delay:1.4s}.n6{animation-delay:1.75s}
      .label{animation:label 3.4s ease-in-out infinite}.l2{animation-delay:.45s}.l3{animation-delay:.9s}.l4{animation-delay:1.35s}.l5{animation-delay:1.8s}.l6{animation-delay:2.25s}
      .scan{animation:scan 6s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-144}}
      @keyframes pulse{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
      @keyframes label{0%,100%{opacity:.58}50%{opacity:1}}
      @keyframes scan{0%{transform:translateX(-210px);opacity:0}15%{opacity:.24}85%{opacity:.24}100%{transform:translateX(1410px);opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="280" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="278" rx="25" fill="none" stroke="#25304A" stroke-opacity=".8"/>

  <g class="grid" stroke="#94A3B8" stroke-width="1">
    <path d="M0 48H1200M0 96H1200M0 144H1200M0 192H1200M0 240H1200"/>
    <path d="M100 0V280M200 0V280M300 0V280M400 0V280M500 0V280M600 0V280M700 0V280M800 0V280M900 0V280M1000 0V280M1100 0V280"/>
  </g>

  <rect class="scan" x="0" y="0" width="180" height="280" fill="#22D3EE" opacity=".06"/>

  <text x="55" y="42" fill="#E5E7EB" font-size="16" font-weight="700" letter-spacing="2">LIVE ENGINEERING STREAM</text>
  <text x="1145" y="42" text-anchor="end" fill="#64748B" font-size="11" letter-spacing="2">BUILD • SHIP • IMPROVE</text>

  <use href="#route" fill="none" stroke="#1E293B" stroke-width="11" opacity=".72"/>
  <use href="#route" fill="none" stroke="url(#track)" stroke-width="3" opacity=".72" class="dash" filter="url(#glow)"/>

  <g>
    <circle cx="105" cy="119" r="26" fill="#111827" stroke="#8B5CF6" stroke-width="2" class="node"/>
    <text x="105" y="124" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">PY</text>
    <text x="105" y="176" text-anchor="middle" fill="#A78BFA" font-size="11" letter-spacing="1.5" class="label">PYTHON</text>

    <circle cx="300" cy="172" r="26" fill="#111827" stroke="#22D3EE" stroke-width="2" class="node n2"/>
    <text x="300" y="177" text-anchor="middle" fill="#CFFAFE" font-size="12" font-weight="700">GIT</text>
    <text x="300" y="220" text-anchor="middle" fill="#67E8F9" font-size="11" letter-spacing="1.5" class="label l2">VERSION</text>

    <circle cx="500" cy="113" r="26" fill="#111827" stroke="#38BDF8" stroke-width="2" class="node n3"/>
    <text x="500" y="118" text-anchor="middle" fill="#E0F2FE" font-size="12" font-weight="700">AWS</text>
    <text x="500" y="168" text-anchor="middle" fill="#7DD3FC" font-size="11" letter-spacing="1.5" class="label l3">CLOUD</text>

    <circle cx="700" cy="171" r="26" fill="#111827" stroke="#22D3EE" stroke-width="2" class="node n4"/>
    <text x="700" y="176" text-anchor="middle" fill="#CFFAFE" font-size="11" font-weight="700">DKR</text>
    <text x="700" y="220" text-anchor="middle" fill="#67E8F9" font-size="11" letter-spacing="1.5" class="label l4">DOCKER</text>

    <circle cx="900" cy="115" r="26" fill="#111827" stroke="#38BDF8" stroke-width="2" class="node n5"/>
    <text x="900" y="120" text-anchor="middle" fill="#E0F2FE" font-size="11" font-weight="700">DATA</text>
    <text x="900" y="168" text-anchor="middle" fill="#7DD3FC" font-size="11" letter-spacing="1.5" class="label l5">PIPELINE</text>

    <circle cx="1085" cy="141" r="26" fill="#111827" stroke="#A3FF12" stroke-width="2" class="node n6"/>
    <text x="1085" y="146" text-anchor="middle" fill="#ECFCCB" font-size="12" font-weight="700">AI</text>
    <text x="1085" y="194" text-anchor="middle" fill="#BEF264" font-size="11" letter-spacing="1.5" class="label l6">PLATFORM</text>
  </g>

  <g filter="url(#glow)">
    <circle r="7" fill="#FFFFFF">
      <animateMotion dur="4.4s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="15" fill="url(#orb)" opacity=".9">
      <animateMotion dur="4.4s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
    </circle>

    <circle r="5" fill="#A3FF12" opacity=".9">
      <animateMotion dur="4.4s" begin="-1.45s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="4" fill="#A78BFA" opacity=".9">
      <animateMotion dur="4.4s" begin="-2.9s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
    </circle>
  </g>

  <g opacity=".5" filter="url(#softGlow)">
    <circle cx="105" cy="119" r="30" fill="#7C3AED"/>
    <circle cx="500" cy="113" r="28" fill="#0EA5E9"/>
    <circle cx="1085" cy="141" r="30" fill="#84CC16"/>
  </g>

  <text x="600" y="262" text-anchor="middle" fill="#64748B" font-size="11" letter-spacing="3">PYTHON → GIT → AWS → DOCKER → DATA → AI PLATFORM</text>
</svg>