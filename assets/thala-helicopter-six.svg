<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-label="Cinematic animated helicopter shot six - Thala For A Reason">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030712"/><stop offset=".48" stop-color="#07111e"/><stop offset="1" stop-color="#020407"/>
  </linearGradient>
  <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#182816"/><stop offset="1" stop-color="#060b07"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff9f0a"/><stop offset=".45" stop-color="#ffd83d"/><stop offset=".72" stop-color="#fff29a"/><stop offset="1" stop-color="#ffae00"/>
  </linearGradient>
  <radialGradient id="lamp">
    <stop offset="0" stop-color="#fff"/><stop offset=".28" stop-color="#fff6c7" stop-opacity=".95"/><stop offset="1" stop-color="#ffd84d" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".75"/>
  </filter>
  <clipPath id="frame"><rect x="10" y="10" width="1420" height="460" rx="30"/></clipPath>
  <style>
    .label{font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:5px}
    .big{font-family:'Arial Black',Impact,Arial,sans-serif;font-weight:900;letter-spacing:1px}
    .thin{font-family:Arial,Helvetica,sans-serif;font-weight:700;letter-spacing:3px}
  </style>
</defs>

<g clip-path="url(#frame)">
  <rect width="1440" height="480" fill="url(#sky)"/>
  <ellipse cx="720" cy="600" rx="940" ry="360" fill="#0d1825"/>
  <path d="M0 320 Q720 220 1440 320 L1440 480 L0 480Z" fill="url(#grass)"/>
  <path d="M0 328 Q720 228 1440 328" fill="none" stroke="#546171" stroke-width="3" opacity=".55"/>

  <!-- stadium tiers -->
  <g opacity=".72">
    <path d="M35 305 Q720 212 1405 305" fill="none" stroke="#1f3147" stroke-width="22"/>
    <path d="M40 296 Q720 205 1400 296" fill="none" stroke="#33465c" stroke-width="2"/>
    <g fill="#ffd84a">
      <circle cx="70" cy="291" r="2"/><circle cx="105" cy="285" r="1.5"/><circle cx="145" cy="279" r="2"/><circle cx="190" cy="270" r="1.6"/>
      <circle cx="235" cy="264" r="2"/><circle cx="278" cy="258" r="1.7"/><circle cx="320" cy="250" r="2"/><circle cx="365" cy="247" r="1.7"/>
      <circle cx="410" cy="240" r="2"/><circle cx="452" cy="236" r="1.7"/><circle cx="498" cy="232" r="2"/><circle cx="548" cy="228" r="1.8"/>
      <circle cx="600" cy="224" r="2"/><circle cx="650" cy="221" r="1.7"/><circle cx="700" cy="219" r="2"/><circle cx="752" cy="221" r="1.8"/>
      <circle cx="804" cy="224" r="2"/><circle cx="854" cy="229" r="1.7"/><circle cx="905" cy="233" r="2"/><circle cx="955" cy="238" r="1.8"/>
      <circle cx="1008" cy="244" r="2"/><circle cx="1058" cy="251" r="1.6"/><circle cx="1108" cy="259" r="2"/><circle cx="1158" cy="268" r="1.8"/>
      <circle cx="1210" cy="276" r="2"/><circle cx="1265" cy="284" r="1.7"/><circle cx="1320" cy="292" r="2"/><circle cx="1370" cy="300" r="1.7"/>
    </g>
  </g>

  <!-- floodlights -->
  <g>
    <rect x="82" y="72" width="8" height="220" fill="#2b3543"/><rect x="1328" y="72" width="8" height="220" fill="#2b3543"/>
    <g filter="url(#glow)">
      <circle cx="62" cy="65" r="35" fill="url(#lamp)"/><circle cx="82" cy="65" r="35" fill="url(#lamp)"/><circle cx="102" cy="65" r="35" fill="url(#lamp)"/>
      <circle cx="1318" cy="65" r="35" fill="url(#lamp)"/><circle cx="1338" cy="65" r="35" fill="url(#lamp)"/><circle cx="1358" cy="65" r="35" fill="url(#lamp)"/>
    </g>
    <g fill="#fffceb">
      <circle cx="62" cy="65" r="5"/><circle cx="82" cy="65" r="5"/><circle cx="102" cy="65" r="5"/>
      <circle cx="1318" cy="65" r="5"/><circle cx="1338" cy="65" r="5"/><circle cx="1358" cy="65" r="5"/>
    </g>
  </g>

  <!-- subtle scoreboard -->
  <rect x="580" y="238" width="210" height="54" rx="10" fill="#05080d" stroke="#2f4257" opacity=".95"/>
  <text x="685" y="272" text-anchor="middle" class="thin" font-size="17" fill="#b9c8d8">CRICKET • NIGHT</text>

  <!-- crease -->
  <path d="M210 398 L790 398" stroke="#d7dbe0" stroke-width="4" opacity=".52"/>
  <path d="M250 430 L760 430" stroke="#d7dbe0" stroke-width="3" opacity=".28"/>

  <!-- wickets -->
  <g stroke="#e8edf2" stroke-width="6" stroke-linecap="round">
    <line x1="305" y1="310" x2="305" y2="401"/><line x1="322" y1="310" x2="322" y2="401"/><line x1="339" y1="310" x2="339" y2="401"/>
    <line x1="301" y1="311" x2="326" y2="311" stroke-width="4"/><line x1="318" y1="311" x2="343" y2="311" stroke-width="4"/>
  </g>

  <!-- cinematic swing trail -->
  <g fill="none" stroke-linecap="round">
    <path d="M462 309 C484 183 621 124 735 182 C785 207 812 245 820 294" stroke="#8b5f05" stroke-width="20" opacity=".18"/>
    <path d="M462 309 C484 183 621 124 735 182 C785 207 812 245 820 294" stroke="url(#gold)" stroke-width="7" opacity="0" filter="url(#glow2)">
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;.15;1;.8;.15;0;0" keyTimes="0;.18;.23;.31;.42;.55;.65;1"/>
      <animate attributeName="stroke-dasharray" dur="7s" repeatCount="indefinite" values="0 900;0 900;80 820;420 480;700 200;900 0;900 0;900 0" keyTimes="0;.18;.23;.31;.42;.55;.65;1"/>
    </path>
  </g>

  <!-- realistic stylized batsman -->
  <g filter="url(#shadow)">
    <!-- back leg -->
    <path d="M509 326 Q495 357 485 402" fill="none" stroke="#e9bd16" stroke-width="28" stroke-linecap="round"/>
    <path d="M485 401 L456 426" fill="none" stroke="#f2f4f7" stroke-width="13" stroke-linecap="round"/>
    <!-- front leg -->
    <path d="M556 322 Q578 357 596 399" fill="none" stroke="#efc51c" stroke-width="29" stroke-linecap="round"/>
    <path d="M596 399 L632 416" fill="none" stroke="#f2f4f7" stroke-width="13" stroke-linecap="round"/>
    <!-- pads -->
    <rect x="474" y="343" width="26" height="63" rx="10" transform="rotate(12 487 374)" fill="#f2cd2a" stroke="#ffe990" stroke-width="3"/>
    <rect x="575" y="344" width="27" height="63" rx="10" transform="rotate(-20 588 375)" fill="#f2cd2a" stroke="#ffe990" stroke-width="3"/>
    <g stroke="#8f7614" stroke-width="2" opacity=".7"><line x1="480" y1="358" x2="499" y2="362"/><line x1="478" y1="371" x2="497" y2="375"/><line x1="579" y1="361" x2="601" y2="353"/><line x1="584" y1="375" x2="605" y2="367"/></g>
    <!-- torso -->
    <path d="M477 238 Q518 211 567 234 Q587 262 578 329 Q535 349 492 326 Q476 285 477 238Z" fill="#f2c616" stroke="#ffe977" stroke-width="3"/>
    <path d="M490 249 Q530 234 567 247" fill="none" stroke="#ddb516" stroke-width="4" opacity=".75"/>
    <text x="535" y="275" text-anchor="middle" class="thin" font-size="14" fill="#111827">DHONI</text>
    <text x="535" y="315" text-anchor="middle" class="big" font-size="48" fill="#111827">7</text>
    <!-- neck -->
    <path d="M510 225 L518 205 L541 207 L550 232Z" fill="#9e633e"/>
    <!-- head -->
    <ellipse cx="531" cy="191" rx="27" ry="30" fill="#a86c46"/>
    <!-- helmet -->
    <path d="M500 191 Q502 151 536 149 Q567 150 572 181 Q548 167 506 181Z" fill="#f5ce20" stroke="#ffe97b" stroke-width="3"/>
    <path d="M555 170 Q583 182 580 204" fill="none" stroke="#111827" stroke-width="5"/>
    <path d="M562 183 L581 190 M559 190 L580 198" stroke="#111827" stroke-width="2"/>
    <!-- shoulder/arms realistic diagonal -->
    <path d="M489 252 Q463 244 443 219" fill="none" stroke="#d8a66d" stroke-width="19" stroke-linecap="round"/>
    <path d="M443 219 Q425 197 413 176" fill="none" stroke="#d8a66d" stroke-width="17" stroke-linecap="round"/>
    <path d="M565 251 Q585 232 603 212" fill="none" stroke="#d8a66d" stroke-width="19" stroke-linecap="round"/>
    <path d="M603 212 Q621 190 634 168" fill="none" stroke="#d8a66d" stroke-width="17" stroke-linecap="round"/>
    <!-- sleeves -->
    <path d="M482 242 Q459 237 446 223" fill="none" stroke="#efc31a" stroke-width="24" stroke-linecap="round"/>
    <path d="M569 244 Q588 230 600 214" fill="none" stroke="#efc31a" stroke-width="24" stroke-linecap="round"/>
    <!-- gloves -->
    <ellipse cx="413" cy="175" rx="13" ry="10" transform="rotate(-42 413 175)" fill="#f4f7fb" stroke="#8ea0b3" stroke-width="3"/>
    <ellipse cx="634" cy="168" rx="13" ry="10" transform="rotate(-42 634 168)" fill="#f4f7fb" stroke="#8ea0b3" stroke-width="3"/>
  </g>

  <!-- rotating bat -->
  <g opacity="1">
    <g>
      <rect x="626" y="51" width="20" height="127" rx="7" fill="#d8aa63" stroke="#f8e7c2" stroke-width="4"/>
      <rect x="631" y="160" width="10" height="48" rx="4" fill="#232c38"/>
      <path d="M630 60 L642 60" stroke="#7a4b1b" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" dur="7s" repeatCount="indefinite"
        values="-44 634 168;-44 634 168;-8 634 168;78 634 168;156 634 168;226 634 168;252 634 168;252 634 168;-44 634 168"
        keyTimes="0;.18;.23;.28;.33;.38;.43;.70;1" calcMode="spline"
        keySplines=".4 0 .2 1;.4 0 .2 1;.2 .8 .2 1;.2 .8 .2 1;.2 .8 .2 1;.2 .8 .2 1;.4 0 .2 1;.4 0 .2 1"/>
    </g>
  </g>

  <!-- strike flash -->
  <g opacity="0" filter="url(#glow)">
    <circle cx="676" cy="205" r="26" fill="url(#lamp)"/>
    <path d="M648 205 L704 205 M676 177 L676 233 M655 184 L697 226 M655 226 L697 184" stroke="#fff7bd" stroke-width="4"/>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;0;1;.15;0;0" keyTimes="0;.29;.32;.335;.36;.41;1"/>
  </g>

  <!-- ball trajectory -->
  <path d="M679 203 C820 143 920 75 1038 48" fill="none" stroke="#ffe060" stroke-width="5" stroke-linecap="round" opacity="0" filter="url(#glow2)">
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;0;1;1;.25;0;0" keyTimes="0;.31;.34;.39;.55;.65;.72;1"/>
    <animate attributeName="stroke-dasharray" dur="7s" repeatCount="indefinite" values="0 700;0 700;40 660;250 450;520 180;700 0;700 0;700 0" keyTimes="0;.31;.34;.39;.50;.60;.70;1"/>
  </path>

  <!-- moving ball -->
  <g opacity="0">
    <circle r="15" fill="url(#lamp)" filter="url(#glow)"/>
    <circle r="7" fill="#fffbea" stroke="#d6ac35" stroke-width="2"/>
    <animateMotion dur="7s" repeatCount="indefinite" path="M679 203 C820 143 920 75 1038 48" keyPoints="0;0;1;1" keyTimes="0;.33;.57;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.32;.34;.60;.70;1"/>
  </g>

  <!-- SIX -->
  <g text-anchor="middle" opacity="0" filter="url(#glow)">
    <text x="885" y="190" class="big" font-size="66" fill="#ffd633">SIX!</text>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;0;1;1;.25;0;0" keyTimes="0;.38;.43;.48;.61;.68;.75;1"/>
    <animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite" values="0 14;0 14;0 0;0 0;0 0" keyTimes="0;.44;.49;.62;1"/>
  </g>

  <!-- dark readability panel -->
  <rect x="930" y="218" width="476" height="184" rx="26" fill="#020407" fill-opacity=".82" stroke="#ffcb28" stroke-opacity=".35" stroke-width="2"/>

  <!-- Main title ALWAYS fully visible, then glows stronger after six -->
  <g filter="url(#shadow)">
    <text x="1168" y="270" text-anchor="middle" class="thin" font-size="17" fill="#f4f6f8">THE HELICOPTER FINISH</text>
    <text x="1168" y="325" text-anchor="middle" class="big" font-size="58" fill="url(#gold)" stroke="#5f3a00" stroke-width="1.2">THALA</text>
    <text x="1168" y="374" text-anchor="middle" class="big" font-size="43" fill="#fff4b0">FOR A REASON</text>
    <path d="M1022 390 Q1168 408 1314 390" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <g opacity=".62">
      <text x="1168" y="423" text-anchor="middle" class="thin" font-size="14" fill="#dce5ee">#7 • HELICOPTER SHOT • SIX</text>
    </g>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values=".88;.88;.88;1;1;.95;.88" keyTimes="0;.45;.55;.62;.82;.93;1"/>
  </g>

  <!-- glow pulse behind main title -->
  <rect x="960" y="246" width="416" height="142" rx="34" fill="none" stroke="#ffc928" stroke-width="4" opacity="0" filter="url(#glow)">
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;0;.75;.18;0;0" keyTimes="0;.52;.58;.64;.78;.92;1"/>
  </rect>

  <!-- top labels -->
  <g>
    <text x="54" y="48" class="label" font-size="15" fill="#d8e0e8">CINEMATIC CRICKET MODE</text>
    <rect x="54" y="59" width="222" height="4" rx="2" fill="url(#gold)"/>
    <text x="54" y="89" class="thin" font-size="12" fill="#8fa0b2">SET • SWING • SIX • SIGNATURE</text>
  </g>

  <!-- footer -->
  <g opacity=".72">
    <line x1="80" y1="451" x2="480" y2="451" stroke="#d8ad2f"/>
    <line x1="960" y1="451" x2="1360" y2="451" stroke="#d8ad2f"/>
    <text x="720" y="456" text-anchor="middle" class="thin" font-size="12" fill="#dce3ea">CRICKET IS A GAME • THALA IS AN EMOTION</text>
  </g>
</g>

<rect x="3" y="3" width="1434" height="474" rx="31" fill="none" stroke="#c99618" stroke-opacity=".55" stroke-width="3"/>
</svg>