<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07121f"/>
      <stop offset="45%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#120a1d"/>
    </linearGradient>

    <radialGradient id="glowL" cx="0.18" cy="0.2" r="0.65">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowR" cx="0.82" cy="0.18" r="0.7">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="68%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".025"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blur12">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <style>
      .title { font-family: "Segoe UI", Arial, sans-serif; font-weight: 800; fill: #f8fafc; letter-spacing: 1px; }
      .subtitle { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a8b3c7; }
      .small { font-family: "Segoe UI", Arial, sans-serif; fill: #cbd5e1; }
      .muted { fill:#7f8ea3; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .dash { stroke-dasharray: 8 10; animation: dash 2.4s linear infinite; }
      .float1 { animation: float1 5.5s ease-in-out infinite; }
      .float2 { animation: float2 7s ease-in-out infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin:center; }
      .scan { animation: scan 6s ease-in-out infinite; }
      .blink { animation: blink 1.15s steps(2,end) infinite; }

      @keyframes dash { to { stroke-dashoffset: -36; } }
      @keyframes float1 { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-8px) } }
      @keyframes float2 { 0%,100% { transform:translateY(0) } 50% { transform:translateY(7px) } }
      @keyframes pulse { 0%,100% { opacity:.55; transform:scale(.9) } 50% { opacity:1; transform:scale(1.15) } }
      @keyframes scan { 0%,100% { transform:translateX(0); opacity:.1 } 50% { transform:translateX(930px); opacity:.38 } }
      @keyframes blink { 50% { opacity:0 } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowL)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowR)"/>

  <circle cx="190" cy="80" r="72" fill="#22d3ee" opacity=".08" filter="url(#blur12)" class="float1"/>
  <circle cx="1010" cy="90" r="88" fill="#a78bfa" opacity=".08" filter="url(#blur12)" class="float2"/>
  <circle cx="865" cy="295" r="76" fill="#f472b6" opacity=".05" filter="url(#blur12)" class="float1"/>

  <rect x="78" y="55" width="1044" height="250" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".08"/>
  <rect x="91" y="68" width="1018" height="224" rx="22" fill="#07101c" fill-opacity=".42" stroke="url(#accent)" stroke-opacity=".32"/>

  <rect x="110" y="89" width="3" height="184" rx="2" fill="url(#accent)" opacity=".9"/>
  <rect x="110" y="89" width="72" height="184" fill="url(#accent)" opacity=".045" class="scan"/>

  <g class="float1">
    <rect x="145" y="109" width="255" height="138" rx="22" fill="#0d1728" fill-opacity=".86" stroke="#22d3ee" stroke-opacity=".28"/>
    <circle cx="178" cy="143" r="7" fill="#22d3ee" filter="url(#softGlow)" class="pulse"/>
    <text x="198" y="149" class="small" font-size="16" font-weight="700">DATA SYSTEMS</text>
    <text x="178" y="182" class="muted" font-size="12">Python • SQL • Spark</text>
    <text x="178" y="205" class="muted" font-size="12">ETL • Pipelines • Analytics</text>
    <path d="M178 224 C220 205 248 213 284 194 C314 178 336 183 370 166" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" class="dash" opacity=".9"/>
  </g>

  <g>
    <text x="600" y="124" text-anchor="middle" class="title" font-size="34">AYAN SAYYAD</text>
    <text x="600" y="153" text-anchor="middle" class="subtitle" font-size="14">ENGINEERING • CLOUD • DEVOPS • AI PLATFORM</text>

    <rect x="486" y="179" width="228" height="58" rx="19" fill="#101827" stroke="url(#accent)" stroke-opacity=".5"/>
    <text x="600" y="204" text-anchor="middle" class="title" font-size="18">BUILD. LEARN. IMPROVE.</text>
    <text x="600" y="224" text-anchor="middle" class="subtitle" font-size="11">repeat → ship → scale</text>

    <circle cx="462" cy="208" r="5" fill="#22d3ee" class="pulse"/>
    <circle cx="738" cy="208" r="5" fill="#f472b6" class="pulse"/>

    <path d="M420 208 H462" stroke="#22d3ee" stroke-width="1.8" class="dash" opacity=".75"/>
    <path d="M738 208 H780" stroke="#f472b6" stroke-width="1.8" class="dash" opacity=".75"/>
  </g>

  <g class="float2">
    <rect x="800" y="109" width="255" height="138" rx="22" fill="#0d1728" fill-opacity=".86" stroke="#a78bfa" stroke-opacity=".3"/>
    <circle cx="833" cy="143" r="7" fill="#a78bfa" filter="url(#softGlow)" class="pulse"/>
    <text x="853" y="149" class="small" font-size="16" font-weight="700">CLOUD + DEVOPS</text>
    <text x="833" y="182" class="muted" font-size="12">AWS • Docker • Terraform</text>
    <text x="833" y="205" class="muted" font-size="12">Linux • CI/CD • Kubernetes</text>

    <g opacity=".95">
      <rect x="833" y="220" width="18" height="10" rx="3" fill="#22d3ee"/>
      <rect x="859" y="212" width="18" height="18" rx="3" fill="#60a5fa"/>
      <rect x="885" y="205" width="18" height="25" rx="3" fill="#8b5cf6"/>
      <rect x="911" y="197" width="18" height="33" rx="3" fill="#a78bfa"/>
      <rect x="937" y="189" width="18" height="41" rx="3" fill="#f472b6"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <g opacity=".9">
    <circle cx="128" cy="97" r="3" fill="#22d3ee"/>
    <circle cx="1078" cy="97" r="3" fill="#f472b6"/>
    <circle cx="128" cy="263" r="3" fill="#60a5fa"/>
    <circle cx="1078" cy="263" r="3" fill="#a78bfa"/>
  </g>

  <text x="600" y="329" text-anchor="middle" class="subtitle" font-size="12">~/ayan $ building practical systems<span class="blink">_</span></text>
</svg>