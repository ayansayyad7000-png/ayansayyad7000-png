<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-label="Animated featured projects grid">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#f43f5e;#22d3ee" dur="7s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#22c55e;#38bdf8;#8b5cf6" dur="9s" repeatCount="indefinite"/></stop></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.m{font-family:ui-monospace,Consolas,monospace}.s{font-family:Inter,Segoe UI,Arial,sans-serif}</style>
</defs>
<rect width="1200" height="180" rx="22" fill="#090b16"/>
<text x="54" y="42" class="m" font-size="13" fill="#64748b">03 / ACTIVE BUILDS</text>
<text x="54" y="80" class="s" font-size="29" font-weight="800" fill="#f8fafc">PROJECT MATRIX</text>
<g transform="translate(570 34)" class="m" font-size="11" fill="#cbd5e1">
  <g><rect width="122" height="48" rx="12" fill="#111827" stroke="#22d3ee"/><text x="61" y="29" text-anchor="middle">RAG / AI</text><animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="3.8s" repeatCount="indefinite"/></g>
  <g transform="translate(145 0)"><rect width="122" height="48" rx="12" fill="#111827" stroke="#34d399"/><text x="61" y="29" text-anchor="middle">DRONE</text><animateTransform attributeName="transform" type="translate" values="145 0;145 -6;145 0" dur="4.2s" repeatCount="indefinite"/></g>
  <g transform="translate(290 0)"><rect width="122" height="48" rx="12" fill="#111827" stroke="#f59e0b"/><text x="61" y="29" text-anchor="middle">AWS LAB</text><animateTransform attributeName="transform" type="translate" values="290 0;290 6;290 0" dur="4.6s" repeatCount="indefinite"/></g>
  <g transform="translate(435 0)"><rect width="122" height="48" rx="12" fill="#111827" stroke="#a78bfa"/><text x="61" y="29" text-anchor="middle">PORTFOLIO</text><animateTransform attributeName="transform" type="translate" values="435 0;435 -6;435 0" dur="4s" repeatCount="indefinite"/></g>
</g>
<g stroke="url(#g)" fill="none" stroke-width="2" filter="url(#glow)" opacity=".8">
  <path d="M570 116 H1127" stroke-dasharray="8 18"><animate attributeName="stroke-dashoffset" values="0;-160" dur="4s" repeatCount="indefinite"/></path>
  <path d="M631 82 V116 M776 82 V116 M921 82 V116 M1066 82 V116"/>
</g>
<circle cx="570" cy="116" r="5" fill="#22d3ee"><animate attributeName="fill" values="#22d3ee;#f472b6;#34d399;#22d3ee" dur="5s" repeatCount="indefinite"/><animate attributeName="cx" values="570;1127;570" dur="7s" repeatCount="indefinite"/></circle>
<text x="54" y="125" class="m" font-size="14" fill="#94a3b8">BUILD → TEST → SHIP → ITERATE</text>
