<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Animated neon comet trail through public repositories">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050814"/>
      <stop offset="0.48" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#12091D"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.35" stop-color="#22D3EE"/>
      <stop offset="0.7" stop-color="#A3FF12"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="head" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <path id="route" d="M78 120 C180 35 285 35 360 112 S545 190 628 108 S810 28 900 106 S1085 190 1122 118 C1080 250 980 325 870 298 S650 250 590 324 S360 390 300 302 S105 245 78 320"/>
    <style>
      text{font-family:Segoe UI,Inter,Arial,sans-serif}
      .grid{opacity:.12}
      .rail{stroke-dasharray:10 16;animation:dash 5s linear infinite}
      .node{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .d1{animation-delay:.35s}.d2{animation-delay:.7s}.d3{animation-delay:1.05s}.d4{animation-delay:1.4s}.d5{animation-delay:1.75s}.d6{animation-delay:2.1s}.d7{animation-delay:2.45s}
      .titleGlow{animation:titlePulse 3s ease-in-out infinite}
      .scan{animation:scan 6s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-104}}
      @keyframes pulse{0%,100%{opacity:.68;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
      @keyframes titlePulse{0%,100%{opacity:.72}50%{opacity:1}}
      @keyframes scan{0%{transform:translateX(-220px);opacity:0}15%,80%{opacity:.65}100%{transform:translateX(1460px);opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="428" rx="27" fill="none" stroke="#26324B"/>

  <g class="grid" stroke="#65758B" stroke-width="1">
    <path d="M0 72H1200M0 144H1200M0 216H1200M0 288H1200M0 360H1200"/>
    <path d="M120 0V430M240 0V430M360 0V430M480 0V430M600 0V430M720 0V430M840 0V430M960 0V430M1080 0V430"/>
  </g>

  <text x="58" y="48" fill="#7DD3FC" font-size="14" font-weight="800" letter-spacing="3" class="titleGlow">PUBLIC REPO COMET TRAIL</text>
  <text x="58" y="70" fill="#8894AA" font-size="12">One moving energy trail across my engineering projects</text>

  <use href="#route" fill="none" stroke="#1D2942" stroke-width="8" opacity=".78"/>
  <use href="#route" fill="none" stroke="url(#rail)" stroke-width="3" class="rail" opacity=".95" filter="url(#glow)"/>

  <!-- Long glowing tail particles -->
  <g filter="url(#glow)">
    <circle r="13" fill="#22D3EE" opacity=".10">
      <animateMotion dur="8s" repeatCount="indefinite" begin="-1.15s"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="9" fill="#67E8F9" opacity=".18">
      <animateMotion dur="8s" repeatCount="indefinite" begin="-0.92s"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="7" fill="#A78BFA" opacity=".30">
      <animateMotion dur="8s" repeatCount="indefinite" begin="-0.70s"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="5.5" fill="#C4B5FD" opacity=".48">
      <animateMotion dur="8s" repeatCount="indefinite" begin="-0.50s"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="4" fill="#A3FF12" opacity=".72">
      <animateMotion dur="8s" repeatCount="indefinite" begin="-0.32s"><mpath href="#route"/></animateMotion>
    </circle>
  </g>

  <!-- Main comet head -->
  <g>
    <circle r="24" fill="url(#head)" opacity=".75" filter="url(#soft)">
      <animateMotion dur="8s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="10" fill="#E6FDFF" stroke="#22D3EE" stroke-width="2" filter="url(#glow)">
      <animateMotion dur="8s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="3.5" fill="#FFFFFF">
      <animateMotion dur="8s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
    </circle>
  </g>

  <!-- Repo checkpoints -->
  <g class="node">
    <circle cx="165" cy="76" r="8" fill="#A78BFA" filter="url(#glow)"/>
    <rect x="92" y="84" width="190" height="44" rx="13" fill="#11182A" stroke="#7C3AED"/>
    <text x="187" y="102" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">NexaRAG</text>
    <text x="187" y="118" text-anchor="middle" fill="#98A4BA" font-size="10">RAG • FastAPI • Docker</text>
  </g>
  <g class="node d1">
    <circle cx="360" cy="112" r="8" fill="#22D3EE" filter="url(#glow)"/>
    <rect x="286" y="125" width="190" height="44" rx="13" fill="#11182A" stroke="#22D3EE"/>
    <text x="381" y="143" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">SkySentinel</text>
    <text x="381" y="159" text-anchor="middle" fill="#98A4BA" font-size="10">Drone • OpenCV</text>
  </g>
  <g class="node d2">
    <circle cx="628" cy="108" r="8" fill="#A3FF12" filter="url(#glow)"/>
    <rect x="540" y="52" width="176" height="44" rx="13" fill="#11182A" stroke="#A3FF12"/>
    <text x="628" y="70" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">My-cloud</text>
    <text x="628" y="86" text-anchor="middle" fill="#98A4BA" font-size="10">AWS • EC2 • S3</text>
  </g>
  <g class="node d3">
    <circle cx="900" cy="106" r="8" fill="#60A5FA" filter="url(#glow)"/>
    <rect x="818" y="122" width="164" height="44" rx="13" fill="#11182A" stroke="#60A5FA"/>
    <text x="900" y="140" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">Portfolio</text>
    <text x="900" y="156" text-anchor="middle" fill="#98A4BA" font-size="10">Web • Branding</text>
  </g>
  <g class="node d4">
    <circle cx="1060" cy="245" r="8" fill="#F472B6" filter="url(#glow)"/>
    <rect x="960" y="255" width="194" height="44" rx="13" fill="#11182A" stroke="#F472B6"/>
    <text x="1057" y="273" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">Python Notes</text>
    <text x="1057" y="289" text-anchor="middle" fill="#98A4BA" font-size="10">Basics • Revision</text>
  </g>
  <g class="node d5">
    <circle cx="870" cy="298" r="8" fill="#38BDF8" filter="url(#glow)"/>
    <rect x="782" y="314" width="176" height="44" rx="13" fill="#11182A" stroke="#38BDF8"/>
    <text x="870" y="332" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">Docker</text>
    <text x="870" y="348" text-anchor="middle" fill="#98A4BA" font-size="10">Containers • CLI</text>
  </g>
  <g class="node d6">
    <circle cx="590" cy="324" r="8" fill="#F97316" filter="url(#glow)"/>
    <rect x="492" y="336" width="196" height="44" rx="13" fill="#11182A" stroke="#F97316"/>
    <text x="590" y="354" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">Git + GitHub</text>
    <text x="590" y="370" text-anchor="middle" fill="#98A4BA" font-size="10">Version Control • CI</text>
  </g>
  <g class="node d7">
    <circle cx="300" cy="302" r="8" fill="#C084FC" filter="url(#glow)"/>
    <rect x="204" y="314" width="192" height="44" rx="13" fill="#11182A" stroke="#C084FC"/>
    <text x="300" y="332" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">Ubuntu Commands</text>
    <text x="300" y="348" text-anchor="middle" fill="#98A4BA" font-size="10">Linux • Terminal</text>
  </g>

  <!-- secondary sparks moving independently -->
  <circle r="3" fill="#A3FF12" opacity=".9" filter="url(#glow)">
    <animateMotion dur="5.8s" repeatCount="indefinite" begin="-2s"><mpath href="#route"/></animateMotion>
  </circle>
  <circle r="2.5" fill="#F472B6" opacity=".85" filter="url(#glow)">
    <animateMotion dur="11s" repeatCount="indefinite" begin="-6s"><mpath href="#route"/></animateMotion>
  </circle>

  <rect x="-180" y="0" width="120" height="430" fill="#22D3EE" opacity=".035" class="scan"/>
  <text x="600" y="410" text-anchor="middle" fill="#66748D" font-size="11" letter-spacing="3">CODE IN MOTION • REPOS ON ONE ENGINEERING TRAIL</text>
</svg>