    <line x1="860" y1="40" x2="860" y2="150" class="grid"/>
    <line x1="1000" y1="40" x2="1000" y2="150" class="grid"/>
  </g>

  <rect x="95" y="40" width="80" height="110" fill="url(#trend)" opacity=".08" class="scan"/>

  <g stroke-linecap="round">
