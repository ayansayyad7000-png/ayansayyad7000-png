<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0b1320"/>
    </linearGradient>
    <linearGradient id="trend" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .grid{stroke:#1e293b;stroke-width:1;opacity:.5}
      .label{fill:#e2e8f0;font-family:Segoe UI,Arial,sans-serif;font-weight:700}
      .sub{fill:#94a3b8;font-family:ui-monospace,Consolas,monospace}
      .pulse{animation:pulse 1.7s ease-in-out infinite;transform-origin:center}
      .scan{animation:scan 5.5s linear infinite}
      @keyframes pulse{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
      @keyframes scan{from{transform:translateX(0);opacity:.08}50%{opacity:.35}to{transform:translateX(950px);opacity:.08}}
    </style>
  </defs>

  <rect width="1200" height="190" rx="24" fill="url(#bg)"/>

  <text x="86" y="26" class="label" font-size="16">ENGINEERING ACTIVITY</text>
  <text x="1115" y="26" text-anchor="end" class="sub" font-size="12">LIVE BUILD SIGNAL</text>

  <g>
    <line x1="85" y1="52" x2="1115" y2="52" class="grid"/>
