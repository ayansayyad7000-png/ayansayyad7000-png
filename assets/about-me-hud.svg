<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Animated About Me engineering identity HUD">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#090D18"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#A3FF12"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:Segoe UI,Inter,Arial,sans-serif}
      .orbit{transform-origin:180px 160px;animation:spin 11s linear infinite}
      .orbit2{transform-origin:180px 160px;animation:spinBack 8s linear infinite}
      .pulse{animation:pulse 2.2s ease-in-out infinite}
      .float1{animation:float 4.5s ease-in-out infinite}
      .float2{animation:float 4.5s ease-in-out .8s infinite}
      .float3{animation:float 4.5s ease-in-out 1.6s infinite}
      .scan{animation:scan 3.8s ease-in-out infinite}
      .dash{stroke-dasharray:9 12;animation:dash 4s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes spinBack{to{transform:rotate(-360deg)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes scan{0%{transform:translateY(-110px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(110px);opacity:0}}
      @keyframes dash{to{stroke-dashoffset:-84}}
    </style>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="284" rx="22" fill="none" stroke="#24304A"/>
  <path d="M36 70H1164M36 250H1164" stroke="#152036" stroke-width="1"/>

  <g>
    <circle cx="180" cy="160" r="84" fill="#0B1222" stroke="#22304B"/>
    <circle class="orbit" cx="180" cy="160" r="102" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="9 15" opacity=".7"/>
    <circle class="orbit2" cx="180" cy="160" r="116" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="4 18" opacity=".6"/>
    <circle cx="180" cy="160" r="56" fill="#0E1729" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
    <text x="180" y="151" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800">AYAN</text>
    <text x="180" y="177" text-anchor="middle" fill="#7DD3FC" font-size="12" letter-spacing="2">ENGINEERING</text>
    <circle cx="180" cy="160" r="8" fill="#A3FF12" class="pulse" filter="url(#glow)"/>
  </g>

  <g transform="translate(330 58)">
    <rect width="820" height="204" rx="20" fill="#0C1424" stroke="#24304A"/>
    <text x="28" y="34" fill="#7DD3FC" font-size="12" letter-spacing="3">PROFILE // ACTIVE</text>
    <text x="28" y="70" fill="#FFFFFF" font-size="25" font-weight="800">B.Tech Information Technology</text>
    <text x="28" y="98" fill="#93A4C3" font-size="14">Building toward Data Engineering and AI Platform Engineering</text>

    <path class="dash" d="M28 124H790" stroke="url(#neon)" stroke-width="2" opacity=".7"/>

    <g class="float1" transform="translate(28 145)">
      <rect width="170" height="38" rx="19" fill="#111A2D" stroke="#22D3EE" stroke-opacity=".7"/>
      <text x="85" y="24" text-anchor="middle" fill="#CFFAFE" font-size="13" font-weight="700">DATA ENGINEERING</text>
    </g>
    <g class="float2" transform="translate(214 145)">
      <rect width="142" height="38" rx="19" fill="#111A2D" stroke="#60A5FA" stroke-opacity=".7"/>
      <text x="71" y="24" text-anchor="middle" fill="#DBEAFE" font-size="13" font-weight="700">AWS CLOUD</text>
    </g>
    <g class="float3" transform="translate(372 145)">
      <rect width="150" height="38" rx="19" fill="#111A2D" stroke="#A78BFA" stroke-opacity=".7"/>
      <text x="75" y="24" text-anchor="middle" fill="#EDE9FE" font-size="13" font-weight="700">DEVOPS + IaC</text>
    </g>
    <g class="float1" transform="translate(538 145)">
      <rect width="230" height="38" rx="19" fill="#111A2D" stroke="#A3FF12" stroke-opacity=".7"/>
      <text x="115" y="24" text-anchor="middle" fill="#ECFCCB" font-size="13" font-weight="700">AI PLATFORM ENGINEERING</text>
    </g>

    <rect class="scan" x="0" y="89" width="820" height="34" fill="url(#scan)" opacity=".65"/>
  </g>

  <text x="600" y="296" text-anchor="middle" fill="#64748B" font-size="11" letter-spacing="4">BUILD • LEARN • IMPROVE • REPEAT</text>
</svg>