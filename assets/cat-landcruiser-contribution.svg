<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".5" stop-color="#07111f"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1e293b"/><stop offset=".6" stop-color="#111827"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1e293b" stroke-width="1" opacity=".32"/></pattern>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .m{font-family:'JetBrains Mono','Fira Code','Courier New',monospace}
    .pulse{animation:pulse 2.1s ease-in-out infinite}.dash{animation:dash 5s linear infinite}.scan{animation:scan 8s linear infinite}.blink{animation:blink 1s steps(1) infinite}
    .car{animation:drive 10s linear infinite}.carbob{animation:carbob .9s ease-in-out infinite}.cat{animation:walk 8s ease-in-out infinite}.tail{transform-origin:0 0;animation:tail .8s ease-in-out infinite}.leg1{transform-origin:0 -18px;animation:leg .48s ease-in-out infinite}.leg2{transform-origin:0 -18px;animation:leg .48s ease-in-out infinite reverse}.bob{animation:bob .48s ease-in-out infinite}.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.15s linear infinite}.pkt1{animation:pkt 4.8s linear infinite}.pkt2{animation:pkt 4.8s 1.6s linear infinite}.pkt3{animation:pkt 4.8s 3.2s linear infinite}.lamp{animation:lamp 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-48}}@keyframes scan{0%{transform:translateX(-320px)}100%{transform:translateX(1450px)}}@keyframes blink{0%,48%{opacity:1}50%,100%{opacity:0}}
    @keyframes drive{0%{transform:translateX(-430px)}100%{transform:translateX(1260px)}}@keyframes carbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes walk{0%{transform:translateX(1080px)}50%{transform:translateX(500px)}100%{transform:translateX(-180px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes tail{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}@keyframes leg{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes pkt{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(890px);opacity:0}}@keyframes lamp{0%,100%{opacity:.45}50%{opacity:1}}
  </style>
</defs>

<rect width="1200" height="360" rx="26" fill="url(#bg)"/>
<rect x="1.5" y="1.5" width="1197" height="357" rx="24" fill="none" stroke="#334155" stroke-width="3"/>
<rect x="10" y="10" width="1180" height="340" rx="19" fill="none" stroke="url(#edge)" stroke-width="1.5" opacity=".9"/>
<rect x="22" y="22" width="1156" height="316" rx="15" fill="url(#grid)"/>

<g opacity=".8"><path d="M26 62H1174" stroke="#1e293b"/><path d="M26 270H1174" stroke="#1e293b"/></g>
<circle cx="47" cy="43" r="5" fill="#fb7185"/><circle cx="66" cy="43" r="5" fill="#fbbf24"/><circle cx="85" cy="43" r="5" fill="#34d399"/>
<text x="112" y="48" class="m" fill="#94a3b8" font-size="12">ayan.profile / contribution-motion-console</text>
<circle cx="1030" cy="43" r="4" fill="#22d3ee" class="pulse" filter="url(#glow)"/><text x="1043" y="47" class="m" fill="#cbd5e1" font-size="11">SYSTEM ONLINE</text>

<text x="42" y="92" class="m" fill="#22d3ee" font-size="13">$ render --mode=custom --snake=false</text>
<text x="42" y="124" class="m" fill="#f8fafc" font-size="25" font-weight="800">CONTRIBUTION MOTION CONSOLE</text>
<text x="42" y="148" class="m" fill="#94a3b8" font-size="12">CAT WALK CYCLE + G-CLASS INSPIRED FIELD NODE + LIVE DATA TELEMETRY</text>

<g transform="translate(760 82)">
 <rect width="382" height="74" rx="12" fill="#07101d" stroke="#26364d"/>
 <text x="18" y="22" class="m" fill="#60a5fa" font-size="11">telemetry.stream</text>
 <text x="18" y="43" class="m" fill="#cbd5e1" font-size="11">vehicle=active   cat=patrol   branch=main</text>
 <text x="18" y="61" class="m" fill="#22d3ee" font-size="11">build → test → deploy → observe</text><rect x="344" y="50" width="7" height="13" rx="1" fill="#22d3ee" class="blink"/>
</g>

<path d="M65 198H1135" stroke="#334155" stroke-width="2" stroke-dasharray="10 10" class="dash"/>
<path d="M65 248H1135" stroke="url(#road)" stroke-width="3" opacity=".9"/>
<g transform="translate(120 181)"><circle r="5" fill="#22d3ee" class="pkt1" filter="url(#glow)"/><circle r="5" fill="#60a5fa" class="pkt2" filter="url(#glow)"/><circle r="5" fill="#a78bfa" class="pkt3" filter="url(#glow)"/></g>

<!-- Boxy G-Class inspired SUV -->
<g class="car">
 <g class="carbob" transform="translate(58 168)">
  <!-- body silhouette -->
  <path d="M28 34L35 9Q37 2 45 2H184Q191 2 196 8L220 31H266Q277 31 284 42L292 57V82H17V53Q18 40 28 34Z" fill="url(#body)" stroke="#60a5fa" stroke-width="2.2"/>
  <!-- squared roof and pillars -->
  <path d="M48 7H178L205 32H45Z" fill="#0c1728" stroke="#475569" stroke-width="1.5"/>
  <path d="M60 13H113V36H52Z" fill="#0b2238" stroke="#38bdf8" stroke-width="1.4"/>
  <path d="M122 13H172L197 36H122Z" fill="#111b31" stroke="#818cf8" stroke-width="1.4"/>
  <!-- pillars / door lines -->
  <path d="M116 9V69M205 32V69M47 32V69" stroke="#334155" stroke-width="1.5"/>
  <path d="M53 43H199" stroke="#1e293b" stroke-width="1.2"/>
  <!-- front grille -->
  <rect x="247" y="39" width="29" height="26" rx="3" fill="#09111e" stroke="#64748b"/>
  <path d="M253 43V61M259 43V61M265 43V61M271 43V61" stroke="#64748b" stroke-width="1.3"/>
  <!-- round headlights -->
  <circle cx="241" cy="51" r="9" fill="#06101d" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="241" cy="51" r="4.6" fill="#22d3ee" class="lamp" filter="url(#glow)"/>
  <!-- rear lamp -->
  <rect x="20" y="43" width="9" height="20" rx="2" fill="#fb7185" opacity=".8"/>
  <!-- bumpers -->
  <rect x="243" y="68" width="48" height="7" rx="3" fill="#111827" stroke="#475569"/>
  <rect x="14" y="68" width="36" height="7" rx="3" fill="#111827" stroke="#475569"/>
  <!-- side step -->
  <rect x="65" y="72" width="141" height="5" rx="2" fill="#334155"/>
  <!-- spare wheel -->
  <circle cx="27" cy="43" r="13" fill="#020617" stroke="#64748b" stroke-width="2"/>
  <circle cx="27" cy="43" r="5" fill="#111827" stroke="#94a3b8"/>
  <!-- tech badge -->
  <rect x="115" y="48" width="74" height="17" rx="4" fill="#07101d" stroke="#334155"/>
  <text x="152" y="60" text-anchor="middle" class="m" fill="#cbd5e1" font-size="8.5">G / DATA OPS</text>
  <!-- wheel arches -->
  <path d="M53 80Q59 54 83 54Q108 54 114 80" fill="#070d17" stroke="#334155" stroke-width="2"/>
  <path d="M197 80Q203 54 227 54Q252 54 258 80" fill="#070d17" stroke="#334155" stroke-width="2"/>
  <!-- wheels -->
  <g class="wheel"><circle cx="83" cy="79" r="27" fill="#020617" stroke="#64748b" stroke-width="3"/><circle cx="83" cy="79" r="16" fill="#0f172a" stroke="#94a3b8"/><circle cx="83" cy="79" r="7" fill="#60a5fa"/><path d="M83 58V100M62 79H104M68 64L98 94M98 64L68 94" stroke="#cbd5e1" stroke-width="2"/></g>
  <g class="wheel"><circle cx="227" cy="79" r="27" fill="#020617" stroke="#64748b" stroke-width="3"/><circle cx="227" cy="79" r="16" fill="#0f172a" stroke="#94a3b8"/><circle cx="227" cy="79" r="7" fill="#a78bfa"/><path d="M227 58V100M206 79H248M212 64L242 94M242 64L212 94" stroke="#cbd5e1" stroke-width="2"/></g>
 </g>
</g>

<!-- Cat walking right to left -->
<g class="cat">
 <g class="bob" transform="translate(0 218)">
  <ellipse cx="56" cy="0" rx="28" ry="15" fill="#d1d5db"/><circle cx="27" cy="-8" r="13" fill="#d1d5db"/>
  <path d="M17 -18L21 -30L28 -19Z" fill="#d1d5db"/><path d="M28 -19L35 -30L38 -17Z" fill="#d1d5db"/>
  <circle cx="24" cy="-9" r="2" fill="#111827"/><circle cx="31" cy="-9" r="2" fill="#111827"/><path d="M26 -4Q29 -2 32 -4" fill="none" stroke="#111827" stroke-width="1.2"/>
  <g class="tail" transform="translate(82 -2)"><path d="M0 0Q24 -19 34 -4Q38 8 23 14" fill="none" stroke="#d1d5db" stroke-width="6" stroke-linecap="round"/></g>
  <g class="leg1" transform="translate(43 11)"><path d="M0 0L-4 23" stroke="#d1d5db" stroke-width="5" stroke-linecap="round"/></g><g class="leg2" transform="translate(58 11)"><path d="M0 0L4 23" stroke="#d1d5db" stroke-width="5" stroke-linecap="round"/></g>
  <g class="leg2" transform="translate(68 9)"><path d="M0 0L-3 22" stroke="#d1d5db" stroke-width="5" stroke-linecap="round"/></g><g class="leg1" transform="translate(35 9)"><path d="M0 0L3 22" stroke="#d1d5db" stroke-width="5" stroke-linecap="round"/></g>
 </g>
</g>

<g transform="translate(44 287)">
 <rect width="250" height="34" rx="9" fill="#07101d" stroke="#26364d"/><text x="14" y="22" class="m" fill="#7dd3fc" font-size="11">CAT_STATUS :: WALKING / SYNCED</text>
 <rect x="268" width="310" height="34" rx="9" fill="#07101d" stroke="#26364d"/><text x="282" y="22" class="m" fill="#a5b4fc" font-size="11">G-NODE :: FIELD / NOMINAL</text>
 <rect x="596" width="500" height="34" rx="9" fill="#07101d" stroke="#26364d"/><text x="610" y="22" class="m" fill="#c4b5fd" font-size="11">PIPELINE :: INGEST → PROCESS → SHIP → MONITOR</text>
</g>

<rect x="-300" y="0" width="250" height="360" fill="url(#edge)" opacity=".035" class="scan"/>
<path d="M30 335H1170" stroke="url(#edge)" stroke-width="1.5" opacity=".75"/>
</svg>