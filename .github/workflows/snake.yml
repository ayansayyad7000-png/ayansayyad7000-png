name: Generate Contribution Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate danger theme snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ayansayyad7000-png
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff1744&color_dots=#fff5f5,#ffb3b3,#ff6d00,#ff1744,#9c27ff
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff1744&color_dots=#12070b,#3a0b14,#7a1022,#ff6d00,#9c27ff

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
