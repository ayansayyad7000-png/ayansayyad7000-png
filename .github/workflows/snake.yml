name: Generate Contribution Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate multicolor snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ayansayyad7000-png
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#58A6FF&color_dots=#EBEDF0,#B6E3FF,#80CCFF,#54AEFF,#0969DA
            dist/github-contribution-grid-snake-dark.svg?color_snake=#A371F7&color_dots=#161B22,#1F3B73,#2F81F7,#00D9FF,#39D353

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
